<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1600"
  height="1050"
  viewBox="0 0 1600 1050"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">
    Autonomous Opportunity Operator architecture
  </title>

  <desc id="desc">
    Architecture diagram showing the AOO product layer,
    seven Google ADK agents using Gemini 3.5 Flash,
    deterministic authority tools, Cloud Firestore state
    and replay, Google Cloud Run deployment, and the
    separation between the public judge-safe service
    and protected proof runtime.
  </desc>

  <defs>
    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#101d31"/>
    </linearGradient>

    <linearGradient
      id="hero"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#17253b"/>
      <stop offset="100%" stop-color="#1d3150"/>
    </linearGradient>

    <filter
      id="shadow"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-opacity="0.24"
      />
    </filter>

    <marker
      id="arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path
        d="M 0 0 L 10 5 L 0 10 z"
        fill="#87a8d8"
      />
    </marker>

