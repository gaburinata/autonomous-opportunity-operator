          700 18px
          Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
        fill: #9fbce0;
        letter-spacing: 1.5px;
      }

      .box-title {
        font:
          700 18px
          Inter,
          ui-sans-serif,
          system-ui,
          sans-serif;
        fill: #f7fbff;
