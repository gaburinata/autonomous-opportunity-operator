[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-opportunity-operator"
version = "0.0.1"
description = "Fresh offline-first Google ADK opportunity decision system"
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.6.3",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "google-cloud-firestore==2.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
